<?xml version="1.0" encoding="UTF-8"?>
<!-- Avatar do usuario na tela de bloqueio/login (projeto PC do Seguidor). Desenho original:
     degrade nas cores do por do sol do papel de parede + inicial do usuario. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb36b"/>
      <stop offset="0.55" stop-color="#e8657a"/>
      <stop offset="1" stop-color="#7b4fd6"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.35" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="128" fill="url(#g)"/>
  <circle cx="128" cy="128" r="128" fill="url(#brilho)"/>
  <text x="128" y="128" dy="0.35em" text-anchor="middle" font-family="DejaVu Sans, sans-serif"
        font-size="128" font-weight="600" fill="#ffffff" fill-opacity="0.95">INICIAL</text>
</svg>
