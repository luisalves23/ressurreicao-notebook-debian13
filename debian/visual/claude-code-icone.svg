<?xml version="1.0" encoding="UTF-8"?>
<!-- Icone proprio do atalho "Claude Code" no dock (projeto PC do Seguidor).
     Desenho original e generico (terminal + brilho), nao e o logotipo da Anthropic. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a073"/>
      <stop offset="1" stop-color="#c8553a"/>
    </linearGradient>
    <linearGradient id="reflexo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>
  <!-- "squircle" no formato dos icones do macOS -->
  <rect x="20" y="16" width="216" height="216" rx="52" fill="url(#fundo)" filter="url(#sombra)"/>
  <rect x="20" y="16" width="216" height="108" rx="52" fill="url(#reflexo)"/>
  <!-- prompt >_ -->
  <path d="M70 92 L112 124 L70 156" fill="none" stroke="#fff8f2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="122" y="150" width="56" height="14" rx="7" fill="#fff8f2"/>
  <!-- brilho de 4 pontas -->
  <path d="M184 52 C 187 70, 190 73, 208 76 C 190 79, 187 82, 184 100 C 181 82, 178 79, 160 76 C 178 73, 181 70, 184 52 Z" fill="#fff8f2"/>
</svg>
